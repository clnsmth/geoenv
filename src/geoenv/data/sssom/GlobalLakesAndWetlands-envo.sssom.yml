mapping_set_description: This mapping set is a manually curated alignment of Global Lakes and Wetlands Database (GLWD v2; https://doi.org/10.6084/m9.figshare.28519994) with the Environment Ontology (ENVO; http://purl.obolibrary.org/obo/envo.owl). Property alignment was created using the Simple Standard for Sharing Ontology Mappings (SSSOM; https://doi.org/10.1093/database/baac035). The motivation of this mapping is to facilitate the classification of environmental properties, in ENVO terms, via queries against the GLWD data source.
