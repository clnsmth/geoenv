mapping_set_description: This mapping set is a manually curated alignment of Global River Classification (GloRiC v1.0; https://doi.org/10.1088/1748-9326/aad8e9) with the Environment Ontology (ENVO; http://purl.obolibrary.org/obo/envo.owl). Property alignment was created using the Simple Standard for Sharing Ontology Mappings (SSSOM; https://doi.org/10.1093/database/baac035). The motivation of this mapping is to facilitate the classification of environmental properties, in ENVO terms, via queries against the GloRiC data source.
