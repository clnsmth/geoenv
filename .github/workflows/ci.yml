name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Check-out repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: "pyproject.toml" # Force the cache to hash the manifest instead of a lockfile

    - name: Install dependencies
      run: uv pip install -r pyproject.toml --extra dev --system


    - name: Run Ruff formatter
      run: uv run ruff format src/ tests/

    - name: Run Ruff linter
      run: uv run ruff check src/ tests/

    - name: Test with pytest
      run: uv run pytest tests/ --cov=soso --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build documentation
      run: uv run make html --directory docs/